  <div class="stage-cap">${ic('spark')}Northwind Robotics · Ashby workspace · live</div>${nc?`<button class="stage-hit" data-act="j-pick" data-r="${nc.role}" aria-label="Enter as ${esc(nc.name)}"><span>Enter as ${esc(nc.name.split(' ')[0])} ${ic('arrow')}</span></button>`:''}`;}
function filmHTML(){const mins=JR.start?Math.max(1,Math.round((Date.now()-JR.start)/60000)):null;const ss=selfShare();
  const cast=[['Jordan Ellis','Recruiting Ops','Turned Tess\'s plan into a live workspace in five days'],['Dev Patel','Recruiter',`${ss.s} candidates booked their own interviews`],['Sam Rivera','Hiring Manager',`Made ${JR.samDecisions||3} decisions from his inbox`],['Ana Kim','Interviewer','Prepared in Slack, feedback the same day'],['Maya Chen','Head of Talent','The CEO opened her report, then she started a trial'],['Tess Morgan','Ashby Customer Success','Spent her hours on design and growth, not reminders']];
  return `<div class="film" role="dialog" aria-modal="true" aria-label="Journey complete"><div class="reel"><div class="kick f" style="--d:.3s">Day 45 · Northwind Robotics</div><h1 class="f" style="--d:.8s">Northwind is live, and growing.</h1><p class="lead f" style="--d:1.4s">Six people met Ashby where they already work: the app, their inbox, Slack. Tess designed the launch and the product carried it to all 134 of them${mins?`. Here, it took ${mins} minute${mins>1?'s':''}`:''}.</p>
  <div class="cast six">${cast.map((c,i)=>`<div class="f" style="--d:${2+i*.4}s">${av(c[0])}<em>✓ ${esc(c[1])}</em><b>${esc(c[0])}</b><span>${esc(c[2])}</span></div>`).join('')}</div>
  <div class="stats">${[[S.hmActive+'/'+S.hmTotal,'Hiring managers active, most from email'],[Math.round(ss.p*100)+'%','Interviews booked by candidates'],['13 days','Go-live to the CEO opening a report'],['7 hrs','Of Customer Success time, none spent chasing']].map((s,i)=>`<div class="f" style="--d:${4.6+i*.25}s"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
  <div class="cta f" style="--d:6s"><button class="p" data-act="j-restart" id="j-again">Start again?</button><button class="s" data-act="j-chapters">Back to chapters</button><button class="s" data-act="j-free">Keep exploring</button></div></div></div>`;}

/* step resolution */
const vis=el=>{if(!el)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0;};
function curStep(){
  if(JR.chIntro)return {kind:'intro',ch:chOf(JR.chIntro)};
  if(JR.chDone)return {kind:'chdone',ch:chOf(JR.chDone)};
  const ch=chOf(S.role);if(!ch||chDone(ch.role))return null;
  const ms=chM(ch.role),m=ms.find(x=>!JR.done[x.id]);const idx=ms.indexOf(m);
  if(m.wait&&m.wait())return {kind:'wait',m,ch,idx};
  for(const s of m.steps){if(s.when&&!s.when())continue;const el=[...document.querySelectorAll(s.tg)].find(e=>vis(e)&&!e.disabled);if(el)return {kind:'step',m,ch,idx,s,el};}
  const nav=m.nav&&!S.modal?document.querySelector(m.nav):null;if(nav&&vis(nav)&&!navOn(m.nav.replace('#nav-','')))return {kind:'nav',m,ch,idx,el:nav};
  return {kind:'lost',m,ch,idx};}
function pips(ch,idx){const ms=chM(ch.role);return `<span class="pips">${ms.map((m,i)=>`<i class="${JR.done[m.id]?'ok':i===idx?'on':''}"></i>`).join('')}</span>`;}
function popHTML(st){const ch=st.ch,ci=CHAPTERS.indexOf(ch)+1;const first=ch.name.split(' ')[0];
  const head=`<div class="k">${av(ch.name,'sm')}<span>${st.m?'Step '+(st.idx+1)+' of '+chM(ch.role).length:esc(first)}</span><span class="sp"></span>${st.m?pips(ch,st.idx):''}</div>`;
  const foot=x=>`<div class="ft"><button class="lk small" data-act="j-chapters">All chapters</button><span class="acts">${x||''}<button class="btn sm ghost" data-act="j-pause">Pause tour</button></span></div>`;
  const note=`<div class="cs-note">${ch.noteFrom?'<span class="bot" style="width:24px;height:24px;border-radius:6px">'+ic('bolt')+'</span>':av('Tess Morgan','sm')}<span>${esc(ch.note)}${ch.noteFrom?'':'<br><span class="muted small">Tess Morgan · your Customer Success Manager at Ashby</span>'}</span></div>`;
  if(st.kind==='intro'){const ms=chM(ch.role);return `<div class="j-pop center" id="j-pop" role="dialog" aria-label="${esc(ch.hi)}"><div class="big">${av(ch.name)}<div><h3>${esc(ch.hi)}</h3><p>${esc(U(ch.name).title||ch.label)} · Northwind Robotics</p></div></div><p>${esc(ch.lead)}</p>${note}<div class="small" style="font-weight:600">Your next steps <span class="muted" style="font-weight:400">· ${esc(ch.where)} · ${esc(ch.time)}</span></div><ul>${ms.map(m=>`<li class="${JR.done[m.id]?'ok':''}"><i></i>${esc(m.t)}</li>`).join('')}</ul><div class="ft"><button class="lk small" data-act="j-chapters">All chapters</button><span class="acts"><button class="btn ghost" data-act="j-pause">I'll look around first</button><button class="btn" data-act="j-go" id="j-go">Let's go ${ic('arrow')}</button></span></div></div>`;}
  if(st.kind==='chdone'){const nc=nextCh();return `<div class="j-pop center" id="j-pop" role="dialog" aria-label="${esc(ch.doneT)}"><div class="big">${av(ch.name)}<div><h3>${esc(ch.doneT)} ✓</h3><p>${esc(ch.doneB)}</p></div></div><ul>${chM(ch.role).map(m=>`<li class="ok"><i></i>${esc(m.t)}</li>`).join('')}</ul><div class="ft"><button class="lk small" data-act="j-chapters">All chapters</button>${nc?`<button class="btn" data-act="j-pick" data-r="${nc.role}" id="j-go">Next chapter: ${esc(nc.name)} ${ic('arrow')}</button>`:`<button class="btn" data-act="j-film" id="j-go">See how it ends ${ic('arrow')}</button>`}</div></div>`;}
  if(st.kind==='wait')return `<div class="j-pop center" id="j-pop" role="status">${head}<h3>${esc(st.m.waitT)}</h3><p>${esc(st.m.waitB)}</p>${foot()}</div>`;
  if(st.kind==='lost')return `<div class="j-pop center" id="j-pop" role="dialog">${head}<h3>${esc(st.m.t)}</h3><p>${esc(st.m.navB||'')}</p>${foot(`<button class="btn sm" data-act="j-take" data-m="${st.m.id}" id="j-go">${esc(st.m.navT||'Take me there')} ${ic('arrow')}</button>`)}</div>`;
  const t=st.kind==='nav'?st.m.navT:txt(st.s.t),b=st.kind==='nav'?st.m.navB:txt(st.s.b)||'';
  return `<div class="j-pop" id="j-pop" role="dialog" aria-label="${esc(t)}">${head}<h3>${esc(t)}</h3>${b?`<p>${esc(b)}</p>`:''}<div class="do">${ic('arrow')}Click the highlighted ${st.kind==='nav'?'menu item':'button'}</div>${foot(st.kind==='nav'?`<button class="btn sm sec" data-act="j-take" data-m="${st.m.id}">Take me there</button>`:'')}</div>`;}
function dockHTML(){const n=MISSIONS.filter(m=>JR.done[m.id]).length,R2=9,C2=2*Math.PI*R2;const ch=chOf(S.role);
  return `<div class="j-dock"><svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="${R2}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="3"/><circle cx="12" cy="12" r="${R2}" fill="none" stroke="#8D7AF0" stroke-width="3" stroke-dasharray="${C2}" stroke-dashoffset="${C2*(1-n/MISSIONS.length)}" transform="rotate(-90 12 12)" stroke-linecap="round"/></svg><span class="lbl">${n}/${MISSIONS.length}${ch?' · '+esc(ch.name.split(' ')[0]):''}</span><button data-act="j-chapters">Chapters</button>${JR.paused?'<button class="pri" data-act="j-resume">Resume tour</button>':''}</div>`;}

const jHost=document.createElement('div');jHost.id='journey';document.body.appendChild(jHost);
function jnavHTML(){const ch=chOf(S.role)||CHAPTERS[0],i=CHAPTERS.indexOf(ch);
  return `<button class="jn-arrow" data-act="j-step" data-d="-1" aria-label="Previous chapter"${i<=0?' disabled':''}>${ic('cl')}</button><button class="jn-cur" data-act="j-chapters" id="chap-btn" aria-label="All chapters">${av(ch.name)}<b>Chapter ${i+1} of ${NCH} · ${esc(ch.name)}</b><span>${esc(ch.label)} · ${esc(ch.day)}</span>${ic('cd')}</button><button class="jn-arrow" data-act="j-step" data-d="1" aria-label="Next chapter"${i>=NCH-1?' disabled':''}>${ic('cr')}</button>`;}
const baseRender=render;
render=function(){
  if(S.page==='launch')JR.visited.launch=true;
  if(S.role==='csm'&&S.page==='home')JR.visited.account=true;
  baseRender();
  const before=Object.assign({},JR.done);
  MISSIONS.forEach(m=>{try{if(m.done())JR.done[m.id]=true;}catch(e){}});
  const fresh=MISSIONS.filter(m=>JR.done[m.id]&&!before[m.id]);
  if(JR.done.s1&&!S.hmBoost){S.hmBoost=true;S.hmActive=Math.min(S.hmTotal,S.hmActive+5);['Nina Kowal','Omar Haddad','Grace Liu'].forEach(n=>U(n).active=true);if(JR.started)setTimeout(()=>toast('22 other hiring managers got the same email. 5 decided before 10am.'),900);}
  if(fresh.length&&JR.started){fresh.forEach(m=>toast('✓ '+m.t));const r=fresh[0].role;if(chDone(r)&&!JR.paused&&S.role===r)JR.chDone=r;}
  if(allDone()&&!JR.filmShown&&JR.started){JR.filmShown=true;setTimeout(()=>{JR.chDone=null;JR.screen='film';paintJourney();},1600);}
  const jn=document.getElementById('jnav');if(jn)jn.innerHTML=jnavHTML();
  paintJourney();
};
let lastKey=null;
function paintJourney(){
  if(JR.zoom)return;
  document.body.classList.toggle('stage',JR.screen==='select');
  if(JR.screen==='select'){jHost.innerHTML=selectHTML();focusIn();return;}
  if(JR.screen==='film'){jHost.innerHTML=filmHTML();focusIn();return;}
  const st=JR.started&&!JR.paused?curStep():null;
  if(!st){jHost.innerHTML=JR.started?dockHTML():'';lastKey=null;JR.cur=null;return;}
  if(['intro','chdone','wait','lost'].includes(st.kind)){jHost.innerHTML=`<div class="j-dim" data-act="j-blocked"></div>${popHTML(st)}${dockHTML()}`;lastKey=st.kind;JR.cur=null;focusIn();return;}
  const key=st.m.id+'|'+(st.s?st.s.tg:'nav');
  if(key!==lastKey||!JR.cur||JR.cur.el!==st.el){lastKey=key;const r=st.el.getBoundingClientRect();if(r.top<70||r.bottom>window.innerHeight-20||r.left<0||r.right>window.innerWidth)st.el.scrollIntoView({block:'center',inline:'center'});}
  jHost.innerHTML=`<div class="j-spot" id="j-spot"></div>${'<button class="j-catch" data-act="j-blocked" aria-hidden="true" tabindex="-1"></button>'.repeat(4)}${popHTML(st)}${dockHTML()}`;
  JR.cur=st;place();}
function place(){const st=JR.cur;if(!st||!st.el||!document.getElementById('j-spot'))return;
  if(!document.contains(st.el)){paintJourney();return;}
  const r=st.el.getBoundingClientRect(),pad=6,W=window.innerWidth,H=window.innerHeight;
  const x=r.left-pad,y=r.top-pad,w=r.width+pad*2,h=r.height+pad*2;
  Object.assign(document.getElementById('j-spot').style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  const c=document.querySelectorAll('.j-catch');const set=(e,l,t,ww,hh)=>Object.assign(e.style,{left:l+'px',top:t+'px',width:Math.max(0,ww)+'px',height:Math.max(0,hh)+'px'});
  set(c[0],0,0,W,y);set(c[1],0,y+h,W,H-y-h);set(c[2],0,y,x,h);set(c[3],x+w,y,W-x-w,h);
  const pop=document.getElementById('j-pop');const pw=pop.offsetWidth,phh=pop.offsetHeight;
  let top=y+h+12,left=Math.min(Math.max(12,r.left+r.width/2-pw/2),W-pw-12);
  if(top+phh>H-12){top=y-12-phh;}
  if(top<56){top=Math.max(56,Math.min(H-phh-12,y));left=r.right+16+pw<W?r.right+16:Math.max(12,r.left-16-pw);}
  pop.style.left=left+'px';pop.style.top=top+'px';
  const dk=document.querySelector('.j-dock');if(dk){dk.style.visibility='';const d=dk.getBoundingClientRect();const hit=(a,b)=>!(a.right<b.left-8||a.left>b.right+8||a.bottom<b.top-8||a.top>b.bottom+8);if(hit(r,d)||hit(pop.getBoundingClientRect(),d))dk.style.visibility='hidden';}}
function focusIn(){const f=document.getElementById('j-go')||document.getElementById('j-begin')||document.getElementById('j-again');if(f)f.focus();}
let raf=0;const req=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(place);};
document.addEventListener('scroll',req,true);window.addEventListener('resize',req);

Object.assign(A,{
  'j-pick':d=>{zoomIn();JR.started=true;if(!JR.start)JR.start=Date.now();JR.screen=null;JR.paused=false;JR.chDone=null;S.modal=null;
    ffBefore(d.r);
    const ch=chOf(d.r);if(chDone(d.r)){JR.paused=true;A.role({r:d.r});toast(ch.name.split(' ')[0]+'\'s chapter is done. Exploring freely. Resume the tour from the corner.');return;}
    JR.chIntro=d.r;A.role({r:d.r});},
  'j-go':()=>{const r=JR.chIntro;JR.chIntro=null;const m=chM(r).find(x=>!JR.done[x.id]);if(m)m.go();else render();},
  'j-take':d=>{const m=MISSIONS.find(x=>x.id===d.m);S.modal=null;m.go();},
  'j-chapters':()=>{JR.screen='select';S.modal=null;paintJourney();},
  'j-free':()=>{zoomIn();JR.screen=null;if(!JR.started){JR.started=true;JR.paused=true;MISSIONS.filter(m=>m.role==='admin').forEach(m=>{try{if(!m.done())m.ff();}catch(e){}});}render();},
  'j-pause':()=>{JR.paused=true;JR.chDone=null;JR.chIntro=null;render();toast('Tour paused. Resume it from the corner anytime.');},
  'j-resume':()=>{JR.paused=false;const ch=chOf(S.role);if(!ch||chDone(ch.role)){const nc=nextCh();if(nc){A['j-pick']({r:nc.role});return;}}render();},
  'j-step':d=>{const ch=chOf(S.role)||CHAPTERS[0];const n=CHAPTERS[CHAPTERS.indexOf(ch)+Number(d.d)];if(n)A['j-pick']({r:n.role});},
  'j-blocked':()=>{const p=document.getElementById('j-pop');if(p){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');}},
  'j-film':()=>{JR.screen='film';JR.chDone=null;paintJourney();},
  'j-restart':()=>{try{location.reload();}catch(e){toast('Reload the page to start again.');}},
  'plan-confirm':()=>{S.planConfirmed=true;toast('Plan confirmed. Tess has been notified.');render();},
  'imp-src':d=>{S.impSrc=d.v;render();},
  'imp-start':()=>{if(S.imp!=='idle')return;S.imp='running';S.impP=0;render();const t=setInterval(()=>{S.impP=Math.min(1,S.impP+.07);if(S.impP>=1){clearInterval(t);S.imp='done';S.imported=true;toast('Import complete. Jobs, candidates and reports are unlocked.');}render();},140);},
  'invite-wave':()=>{S.modal={t:'wave'};render();},
  'wave-go':()=>{S.invited=true;S.modal=null;toast('6 invites sent. Each one opens on that person\'s own jobs.');render();},
  'inbox-open':()=>{S.modal=null;go('home');},
  'trial-start':()=>{S.trial=true;toast('Trial started. Tess has the evidence and will check in Thursday.');render();},
  'talk-tess':()=>{toast('Tess will reach out today with times.');},
  'book-exp':()=>{S.bookSlot=null;S.modal={t:'book'};render();},
  'book-slot':d=>{S.bookSlot=d.v;render();},
  'book-go':()=>{S.booked=true;S.modal=null;toast('Invite sent to Maya with the agenda attached.');render();}
});
function ffBefore(r){const idx=CHAPTERS.findIndex(c=>c.role===r);let n=0;CHAPTERS.slice(0,Math.max(0,idx)).forEach(c=>chM(c.role).forEach(m=>{let ok=false;try{ok=m.done();}catch(e){}if(!ok){try{m.ff();}catch(e){}n++;}JR.done[m.id]=true;}));
  if(n)setTimeout(()=>toast('Fast-forwarded '+n+' earlier moment'+(n>1?'s':'')+' so the story lines up'),300);}
function zoomIn(){if(!document.body.classList.contains('stage'))return;const fast=window.matchMedia('(prefers-reduced-motion: reduce)').matches||window.innerWidth<=860;
  const sel=document.querySelector('.sel');if(sel)sel.classList.add('out');document.querySelectorAll('.stage-hit,.stage-cap').forEach(e=>e.remove());
  document.body.classList.add('zooming');document.body.classList.remove('stage');if(fast){document.body.classList.remove('zooming');jHost.innerHTML='';return;}JR.zoom=true;setTimeout(()=>{JR.zoom=false;document.body.classList.remove('zooming');jHost.querySelectorAll('.sel').forEach(e=>e.remove());paintJourney();place();},950);}
const wrap=(k,fn)=>{const o=A[k];A[k]=(d,el,e)=>{fn(d);o(d,el,e);};};
wrap('rv-adv',()=>{JR.reviewed=true;});
wrap('rv-rej',()=>{if(v('rv-reason'))JR.reviewed=true;});
wrap('briefing',()=>{if(S.role==='int')JR.briefed=true;});
['advance','hm-rej','archive-go'].forEach(k=>wrap(k,()=>{if(S.role==='hm')JR.samDecisions++;}));
wrap('role',d=>{JR.chDone=null;if(JR.started&&!JR.paused&&d&&d.r)ffBefore(d.r);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&JR.screen){if(JR.started||JR.screen==='film'){e.stopImmediatePropagation();A['j-free']();}return;}
  if(JR.screen){e.stopImmediatePropagation();}
},true);


render();
})();
</script>
