<title>Northwind Recruiting Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: full-viewport product shell. Concept strip on top, app bar, icon sidebar, scrolling main, slide-in side panel, modals. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --raised:#FFFFFF; --sunk:#EDEFF2; --hover:#F1F3F5; --ink:#14171F; --ink-2:#3B4250; --muted:#6A7282; --line:#E1E4EA; --line-2:#CDD2DA;
  --accent:#0A6C6C; --accent-ink:#FFFFFF; --accent-soft:#E1F0EF; --accent-line:#9CCFCB;
  --signal:#A35A00; --signal-soft:#FCF0DC; --good:#26734A; --good-soft:#E2F2E8; --crit:#B42318; --crit-soft:#FBE7E5;
  --cs:#5944B8; --cs-soft:#ECE8FB; --strip:#14171F; --strip-ink:#E8EAEE;
  --scrim:rgba(16,19,26,.32);
  --f:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --sh-1:0 1px 2px rgba(20,24,34,.06);
  --sh-2:0 4px 16px rgba(20,24,34,.10), 0 1px 3px rgba(20,24,34,.06);
  --sh-3:0 18px 48px rgba(20,24,34,.20);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#161A21; --raised:#1B2029; --sunk:#1E232C; --hover:#20262F; --ink:#E8EBF0; --ink-2:#C3C9D3; --muted:#949DAC; --line:#272D37; --line-2:#363E4A;
  --accent:#4DBFB4; --accent-ink:#06201E; --accent-soft:#12302D; --accent-line:#2A6A64;
  --signal:#E7A94B; --signal-soft:#32260F; --good:#63C690; --good-soft:#13291C; --crit:#F28A81; --crit-soft:#3A1714;
  --cs:#AB9CF2; --cs-soft:#241E44; --strip:#05070A; --strip-ink:#D9DDE3; --scrim:rgba(0,0,0,.55);
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 18px rgba(0,0,0,.45); --sh-3:0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A21; --raised:#1B2029; --sunk:#1E232C; --hover:#20262F; --ink:#E8EBF0; --ink-2:#C3C9D3; --muted:#949DAC; --line:#272D37; --line-2:#363E4A;
  --accent:#4DBFB4; --accent-ink:#06201E; --accent-soft:#12302D; --accent-line:#2A6A64;
  --signal:#E7A94B; --signal-soft:#32260F; --good:#63C690; --good-soft:#13291C; --crit:#F28A81; --crit-soft:#3A1714;
  --cs:#AB9CF2; --cs-soft:#241E44; --strip:#05070A; --strip-ink:#D9DDE3; --scrim:rgba(0,0,0,.55);
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 18px rgba(0,0,0,.45); --sh-3:0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;max-width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;min-height:72px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.shell{background:var(--bg);height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
/* concept strip */
.strip{background:var(--strip);color:var(--strip-ink);display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px max(14px, env(safe-area-inset-right,0px)) 6px max(14px, env(safe-area-inset-left,0px));font-size:12.5px}
.strip .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.strip .roles{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:8px;padding:2px;flex-wrap:wrap}
.strip .roles button{border:0;background:none;color:inherit;opacity:.75;padding:3px 9px;border-radius:6px;font-size:12.5px}
.strip .roles button[aria-pressed="true"]{background:var(--strip-ink);color:var(--strip);opacity:1;font-weight:600}
.strip .sp{flex:1}
.strip button.plain{border:0;background:none;color:inherit;display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 4px}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:#63C690}
.sw{width:28px;height:16px;border-radius:8px;background:rgba(255,255,255,.25);position:relative;display:inline-block}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
[aria-pressed="true"] > .sw{background:#8D7AF0}
[aria-pressed="true"] > .sw::after{left:14px}

/* app bar */
.appbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap;min-width:0}
.logo b{width:24px;height:24px;border-radius:6px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:12px;flex:none}
.gs{position:relative;flex:1 1 260px;max-width:520px;min-width:0}
.gs svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gs input{width:100%;padding-left:30px;background:var(--sunk);border-color:transparent}
.gs kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface)}
.gs-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--raised);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-2);z-index:40;padding:6px;max-height:380px;overflow:auto}
.gs-pop h6{margin:6px 8px 4px;font-size:11px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.gs-pop button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:7px 8px;border-radius:7px}
.gs-pop button:hover,.gs-pop button.kb{background:var(--hover)}
.gs-pop small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
.bar-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:7px;height:30px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.ib:hover{background:var(--hover)}
.ib.icon{width:30px;padding:0;justify-content:center}
.mw{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--raised);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-2);z-index:40;padding:5px;min-width:210px;display:grid}
.menu.left{left:0;right:auto}
.menu button,.menu a{display:flex;gap:9px;align-items:center;border:0;background:none;text-align:left;padding:7px 9px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px}
.menu button:hover,.menu a:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .who{padding:8px 9px 6px;display:grid}
.menu .who small{color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none;border:0;background:var(--accent-soft);color:var(--accent)}
.av.sm{width:22px;height:22px;font-size:9.5px}
.av.lg{width:48px;height:48px;font-size:16px}
.av.c1{background:#E3EEF9;color:#245A94}.av.c2{background:#F6E8DC;color:#8A4B12}.av.c3{background:#E6F2E6;color:#2E6B33}.av.c4{background:#F1E6F4;color:#7A3B8C}.av.c5{background:#FBEAEA;color:#9B2C2C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av.c1{background:#16283C;color:#8DB8E8}:root:not([data-theme="light"]) .av.c2{background:#33240F;color:#E9B37A}:root:not([data-theme="light"]) .av.c3{background:#15291A;color:#8DD19A}:root:not([data-theme="light"]) .av.c4{background:#2C1B33;color:#D3A1E2}:root:not([data-theme="light"]) .av.c5{background:#361818;color:#F0A0A0}}
:root[data-theme="dark"] .av.c1{background:#16283C;color:#8DB8E8}:root[data-theme="dark"] .av.c2{background:#33240F;color:#E9B37A}:root[data-theme="dark"] .av.c3{background:#15291A;color:#8DD19A}:root[data-theme="dark"] .av.c4{background:#2C1B33;color:#D3A1E2}:root[data-theme="dark"] .av.c5{background:#361818;color:#F0A0A0}
.avs{display:inline-flex}
.avs .av{border:2px solid var(--surface);margin-left:-6px}
.avs .av:first-child{margin-left:0}

/* layout */
.body{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px 20px;display:grid;align-content:start;gap:1px}
.ng{font-size:11px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:14px 10px 5px}
.nv{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:6px 10px;border-radius:7px;color:var(--ink-2);width:100%;font-size:13.5px}
.nv:hover{background:var(--hover)}
.nv.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nv.on svg{color:var(--accent)}
.nv .ct{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.nv .ct.hot{background:var(--signal-soft);color:var(--signal);padding:0 6px;border-radius:999px}
.mainwrap{position:relative;min-width:0;min-height:0;display:grid}
.main{overflow-y:auto;min-width:0;padding:22px 26px 60px}
.page{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (max-width:860px){
  body{overflow:auto}
  .shell{height:auto;min-height:100%}
  .body{grid-template-columns:minmax(0,1fr)}
  .side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;gap:2px}
  .ng{display:none}
  .nv{width:auto;white-space:nowrap}
  .main{overflow:visible;padding:16px max(16px, env(safe-area-inset-right,0px)) 40px max(16px, env(safe-area-inset-left,0px))}
  .gs kbd{display:none}
  .logo span{display:none}
}

/* page header */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.ph p{color:var(--muted);margin-top:3px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:6px}
.crumbs button{border:0;background:none;padding:0;color:var(--muted)}
.crumbs button:hover{color:var(--accent);text-decoration:underline}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:7px;padding:6px 12px;font-weight:500;background:var(--accent);color:var(--accent-ink);white-space:nowrap;font-size:13.5px;line-height:1.35}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.sec:hover{background:var(--hover);filter:none}
.btn.ghost{background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--crit);color:#fff}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.lk{border:0;background:none;padding:0;color:var(--accent);font-weight:500;text-align:left}
.lk:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:600}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:14.5px;font-weight:600}
.panel-h .meta{color:var(--muted);font-size:12.5px}
.panel-b{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.panel-b.flush{padding:0}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols.prof{grid-template-columns:minmax(0,1fr) 300px}
.stackc{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);min-width:0}
@media (max-width:1080px){.cols,.cols.even,.cols.prof{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:var(--f-mono)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* chips / status */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.nodot::before{display:none}
.p-warn{background:var(--signal-soft);color:var(--signal)}
.p-good{background:var(--good-soft);color:var(--good)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--sunk);color:var(--muted)}
.p-cs{background:var(--cs-soft);color:var(--cs)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line-2);border-radius:5px;padding:0 6px;color:var(--ink-2);background:var(--surface)}
.tag button{border:0;background:none;padding:0;color:var(--muted);line-height:1}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px;text-align:left;border:0;border-radius:0}
button.kpi:hover{background:var(--hover)}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi.warn b{color:var(--signal)}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* lists */
.rows{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.nb{grid-template-columns:minmax(0,1fr) auto}
.row .t{font-weight:500}
.row .s{color:var(--muted);font-size:12.5px}
.row:hover{background:var(--hover)}
.row.static:hover{background:none}

/* tables */
.tw{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.t th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.cl{cursor:pointer}
table.t tbody tr.cl:hover td{background:var(--hover)}
table.t tbody tr.sel td{background:var(--accent-soft)}
table.t td .s{display:block;color:var(--muted);font-size:12px}
table.t input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}
th.chk,td.chk{width:34px;padding-right:0}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who > div{min-width:0}
.who b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* toolbars */
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tb .search{position:relative;flex:1 1 220px;max-width:340px;min-width:0}
.tb .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tb .search input{width:100%;padding-left:30px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line-2);background:var(--surface);border-radius:7px;padding:5px 10px;font-size:13px;color:var(--ink-2)}
.fchip[aria-pressed="true"]{border-style:solid;border-color:var(--accent-line);background:var(--accent-soft);color:var(--ink)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-radius:9px;background:var(--ink);color:var(--surface)}
.bulk .btn.sec{background:transparent;color:inherit;border-color:rgba(255,255,255,.3)}
.bulk .btn.sec:hover{background:rgba(255,255,255,.1)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;min-width:0}
.tab{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .c{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--sunk);border-radius:999px;padding:0 6px}

/* stage strip */
.stages{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stg{border:0;background:none;padding:9px 14px;display:grid;text-align:left;min-width:118px;border-right:1px solid var(--line);position:relative}
.stg:last-child{border-right:0}
.stg span{font-size:12px;color:var(--muted);white-space:nowrap}
.stg b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stg[aria-pressed="true"]{background:var(--accent-soft)}
.stg[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.stg .alert{position:absolute;top:8px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--signal)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--sunk);border-radius:10px;display:grid;grid-template-rows:auto minmax(0,1fr);max-height:640px;border:1.5px dashed transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;font-weight:600;font-size:13px}
.col-h em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:400}
.col-b{overflow-y:auto;padding:4px 8px 10px;display:grid;gap:7px;align-content:start;min-height:120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:grid;gap:5px;cursor:pointer;box-shadow:var(--sh-1);text-align:left}
.card:hover{border-color:var(--line-2);box-shadow:var(--sh-2)}
.card.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card .nm{font-weight:600;font-size:13.5px}
.card .sb{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card[draggable="true"]{cursor:grab}
.score{display:inline-flex;gap:2px;align-items:center}
.score i{width:6px;height:12px;border-radius:2px;background:var(--line-2)}
.score i.on{background:var(--accent)}

/* side panel */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh-3);z-index:21;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.dr-top{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.dr-top .sp{flex:1}
.dr-head{padding:16px 18px 12px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.dr-body{overflow-y:auto;padding:0 18px 30px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
@media (max-width:860px){.mainwrap{position:static}.scrim,.drawer{position:fixed}.drawer{padding-bottom:env(safe-area-inset-bottom,0px)}}

/* profile */
.pid{display:flex;gap:14px;align-items:center;min-width:0}
.pid h1{font-size:20px;font-weight:600;line-height:1.25}
.pid p{color:var(--muted);font-size:13px}
.cons{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.past{background:var(--accent-line)}
.prog i.now{background:var(--accent)}
.prog-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;gap:4px}
.next{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.next.warn{border-color:transparent;background:var(--signal-soft)}
.next.done{border-color:transparent;background:var(--sunk)}
.next b{display:block}
.next span{color:var(--ink-2);font-size:13px}
.sticky{position:sticky;top:0;background:var(--surface);z-index:2;display:grid;gap:8px;padding-top:12px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.feed{display:grid}
.fe{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.fe:first-child{border-top:0}
.fe .h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.fe .h small{color:var(--muted);font-size:12px}
.fe .bd{margin-top:6px;padding:9px 11px;border-radius:8px;background:var(--sunk);font-size:13.5px}
.fe .bd p+p{margin-top:6px}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sc-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.sc-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.crit span:nth-child(odd){color:var(--ink-2)}
.rec{font-weight:600;font-size:13px}
.rec.r4{color:var(--good)}.rec.r3{color:var(--accent)}.rec.r2{color:var(--signal)}.rec.r1{color:var(--crit)}
.resume{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:22px 24px;display:grid;gap:14px;font-size:13.5px}
.resume h3{font-size:18px;font-weight:600}
.resume h4{font-size:11.5px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding-bottom:4px}
.resume .job{display:grid;gap:3px}
.resume .job .r1{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.resume ul{margin:2px 0 0;padding-left:18px;display:grid;gap:2px;color:var(--ink-2)}

/* review mode */
.rv{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1180px){.rv{grid-template-columns:minmax(0,1fr) 300px}.rv .q{display:none}}
@media (max-width:860px){.rv{grid-template-columns:minmax(0,1fr)}}
.q .row{cursor:pointer;grid-template-columns:minmax(0,1fr) auto}
.q .row[aria-current="true"]{background:var(--accent-soft)}
.decide{position:sticky;top:0}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.rate button{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:6px 4px;font-size:12px;display:grid;gap:1px;text-align:center}
.rate button b{font-size:14px}
.rate button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.rate.mini button{padding:3px 4px}
.hk{display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:12px}

/* forms */
.fg{display:grid;gap:12px}
.fg label{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--ink-2)}
.fg label small{font-weight:400;color:var(--muted)}
.fg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex !important;align-items:center;gap:8px;font-weight:400 !important}
.check input{width:15px;height:15px;accent-color:var(--accent)}

/* modal */
.mscrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:start center;padding:8vh 16px 16px;overflow:auto}
.modal{width:min(560px,100%);background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-3);display:grid;grid-template-columns:minmax(0,1fr)}
.modal.wide{width:min(820px,100%)}
.m-h{display:flex;justify-content:space-between;align-items:start;gap:10px;padding:16px 18px 12px}
.m-h h2{font-size:16px;font-weight:600}
.m-h p{color:var(--muted);font-size:13px;margin-top:2px}
.m-b{padding:4px 18px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.m-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;border-radius:6px;width:28px;height:28px;display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{background:var(--hover);color:var(--ink)}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line-2);border-radius:9px;padding:11px 12px;background:var(--surface);display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt svg{grid-row:span 2;margin-top:2px;color:var(--accent)}
.opt span{color:var(--muted);font-size:12.5px}
.opt[disabled]{opacity:.55;cursor:not-allowed}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.steps span{padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.steps span.on{background:var(--ink);color:var(--surface)}
.steps span.done{background:var(--accent-soft);color:var(--accent)}

/* availability grid */
.avail{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));gap:3px;font-size:12px}
.avail .hd{text-align:center;color:var(--muted);padding:2px 0 4px}
.avail .hd b{display:block;color:var(--ink);font-weight:600}
.avail .tm{color:var(--muted);text-align:right;padding-right:6px;font-family:var(--f-mono);font-size:11px;line-height:26px}
.slot{height:26px;border-radius:5px;border:1px solid transparent;background:var(--sunk);font-size:11px}
.slot.free{background:var(--good-soft);border-color:transparent;color:var(--good)}
.slot.free:hover{border-color:var(--good)}
.slot.busy{background:repeating-linear-gradient(135deg,var(--sunk),var(--sunk) 4px,var(--line) 4px,var(--line) 6px);cursor:not-allowed}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.hbars{display:grid;gap:7px}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.hb .tr{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;position:relative}
.hb .tr i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.hb .tr i.w{background:var(--signal)}.hb .tr i.g{background:var(--good)}
.hb .tr .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.hb .v{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:560px){.hb{grid-template-columns:100px minmax(0,1fr) 54px}}
.funnel{display:grid;gap:4px}
.fn{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.fn .tr{height:26px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fn .tr i{display:flex;align-items:center;height:100%;background:var(--accent);border-radius:6px;color:var(--accent-ink);font-size:12px;padding-left:8px;font-family:var(--f-mono);min-width:fit-content}
.fn .cv{font-size:12px;color:var(--muted);font-family:var(--f-mono);text-align:right}
@media (max-width:560px){.fn{grid-template-columns:90px minmax(0,1fr) 80px}}

/* onboarding / proposed */
.prop{position:relative}
.hl .prop{outline:2px dashed var(--cs);outline-offset:3px;border-radius:10px}
.hl .prop::after{content:"Proposed";position:absolute;top:-9px;right:12px;background:var(--cs);color:#fff;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;z-index:3;pointer-events:none}
.nudge{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:10px;background:var(--cs-soft);border:1px solid transparent;font-size:13.5px}
.nudge svg{color:var(--cs);margin-top:2px}
.nudge > div{flex:1;min-width:0}
.nudge b{display:block}
.nudge .acts{margin-top:8px}
.nudge.warn{background:var(--signal-soft)}
.nudge.warn svg{color:var(--signal)}
.nudge.ok{background:var(--good-soft)}
.nudge.ok svg{color:var(--good)}
.chk{list-style:none;margin:0;padding:0;display:grid}
.chk li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk .d{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.chk li.ok .d{background:var(--good);border-color:var(--good);color:#fff}
.chk li.ok .d::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk li.ok .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.chk small{display:block;color:var(--muted);font-size:12.5px}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.w i{background:var(--signal)}.meter.g i{background:var(--good)}
.mail{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mail-h{background:var(--sunk);padding:10px 14px;font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.mail-h b{color:var(--ink);font-size:14px}
.mail-b{padding:14px;display:grid;gap:10px}
.mail .mc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

/* toast */
.toasts{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--surface);border-radius:9px;padding:9px 12px 9px 14px;box-shadow:var(--sh-3);display:flex;gap:14px;align-items:center;font-size:13.5px}
.toast button{pointer-events:auto;border:0;background:none;color:var(--accent-line);font-weight:600;padding:2px 4px}
@media (prefers-reduced-motion: no-preference){
  .drawer{animation:dr .18s ease-out}
  .modal{animation:md .16s ease-out}
  .toast{animation:md .16s ease-out}
  @keyframes dr{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes md{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
}

/* ===== onboarding journey (game layer) ===== */
.hud{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:372px;max-height:calc(100vh - 140px);background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);z-index:45;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.hud-h{background:var(--strip);color:var(--strip-ink);padding:12px 14px 12px;display:grid;gap:9px}
.hud-h .r1{display:flex;align-items:center;gap:8px}
.hud-h .r1 b{font-size:14px}
.hud-h .r1 .sp{flex:1}
.hud-h .r1 button{border:0;background:rgba(255,255,255,.1);color:inherit;border-radius:6px;height:26px;padding:0 8px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.hud-h .r1 button:hover{background:rgba(255,255,255,.18)}
.hud-h small{opacity:.7;font-size:12px}
.chs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.chs i{height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;position:relative}
.chs i b{position:absolute;inset:0 auto 0 0;background:#8D7AF0;border-radius:3px;transition:width .4s}
.chs i.done b{background:#63C690}
.hud-b{overflow-y:auto;padding:6px 0 8px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border:0;background:none;text-align:left;width:100%}
.ch:hover{background:var(--hover)}
.ch .nm{font-weight:600;font-size:13.5px}
.ch .rl{color:var(--muted);font-size:12px}
.ch .ct{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ch.done .ct{color:var(--good)}
.ch.cur{background:var(--cs-soft)}
.ch .av{position:relative}
.ch.done .av::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:14px;height:14px;border-radius:50%;background:var(--good);color:#fff;font-size:9px;display:grid;place-items:center;border:2px solid var(--raised)}
.ms-list{display:grid;padding:2px 14px 10px 52px;gap:2px}
.ms{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:7px 0;font-size:13px;align-items:start}
.ms .d{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);margin-top:2px;display:grid;place-items:center}
.ms.ok .d{background:var(--good);border-color:var(--good)}
.ms.ok .d::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ms.ok .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.ms.cur .tt{font-weight:600}
.ms .why{color:var(--muted);font-size:12px;margin-top:2px}
.ms .go{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.ms.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--good-soft)}100%{background:transparent}}
.next-up{margin:6px 14px 4px;padding:12px;border-radius:10px;background:var(--good-soft);display:grid;gap:8px;font-size:13px}
.next-up b{font-size:14px}
.hud-pill{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:10px;background:var(--strip);color:var(--strip-ink);border:0;border-radius:999px;padding:8px 14px 8px 10px;box-shadow:var(--sh-3);font-size:13px;max-width:calc(100% - 32px)}
.hud-pill .ring{width:26px;height:26px;flex:none}
.hud-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){.hud{left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px));width:auto;max-height:62vh}.toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.beacon{outline:2px solid #8D7AF0 !important;outline-offset:2px;animation:beacon 1.6s ease-out infinite;position:relative;z-index:2}
@keyframes beacon{0%{box-shadow:0 0 0 0 rgba(141,122,240,.6)}70%{box-shadow:0 0 0 12px rgba(141,122,240,0)}100%{box-shadow:0 0 0 0 rgba(141,122,240,0)}}

/* film overlays (intro + finale): a deliberately single dark look */
.film{position:fixed;inset:0;z-index:80;align-items:start;background:radial-gradient(120% 90% at 50% 10%,#1A1F2B 0%,#07090C 60%);color:#EDEFF3;display:grid;place-items:center;overflow:auto;padding:calc(9vh + 28px) max(20px, env(safe-area-inset-right,0px)) 12vh max(20px, env(safe-area-inset-left,0px))}
.film::before,.film::after{content:"";position:fixed;left:0;right:0;height:9vh;background:#000;z-index:1}
.film::before{top:0}.film::after{bottom:0}
.film .reel{max-width:1120px;width:100%;display:grid;gap:20px;margin:auto 0;padding-bottom:calc(9vh + 12px);position:relative;z-index:2}
.film .kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9AA3B2}
.film h1{font-size:clamp(30px,5vw,52px);line-height:1.05;font-weight:600;letter-spacing:-.02em;color:#fff}
.film .lead{font-size:17px;color:#C3C9D3;max-width:60ch}
.film .cast{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:820px){.film .cast{grid-template-columns:1fr 1fr}}
.film .cast div{display:grid;gap:8px;align-content:start;padding:12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.film .cast .av{width:36px;height:36px;font-size:12px}
.film .cast b{display:block;color:#fff;font-weight:600}
.film .cast span{color:#9AA3B2;font-size:13px}
.film .cast em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:#63C690;letter-spacing:.06em;text-transform:uppercase}
.film .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.film .stats div{padding:14px;border-radius:10px;background:rgba(255,255,255,.05);display:grid;gap:2px}
.film .stats b{font-size:28px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.film .stats span{font-size:12.5px;color:#9AA3B2}
@media (max-width:700px){.film .stats{grid-template-columns:1fr 1fr}}
.film .cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.film .cta button{border:0;border-radius:10px;padding:12px 20px;font-weight:600;font-size:15px}
.film .cta .p{background:#EDEFF3;color:#07090C}
.film .cta .s{background:transparent;color:#C3C9D3;border:1px solid rgba(255,255,255,.2)}
.film .chap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.film .chap div{padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);display:grid;gap:4px;font-size:12.5px;color:#9AA3B2}
.film .chap b{color:#fff;font-size:13px}
@media (max-width:700px){.film .chap{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: no-preference){
  .film{animation:filmIn .5s ease both}
  .film::before{animation:barT .9s cubic-bezier(.2,.7,.2,1) both}
  .film::after{animation:barB .9s cubic-bezier(.2,.7,.2,1) both}
  .film .f{animation:fUp .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
  @keyframes filmIn{from{opacity:0}to{opacity:1}}
  @keyframes barT{from{transform:translateY(-100%)}to{transform:none}}
  @keyframes barB{from{transform:translateY(100%)}to{transform:none}}

function statusOf(c){const j=J(c.job);

/* ============ pipeline & search ============ */
const CHIPS=[['all','All active'],['review','Needs review'],['hmr','Waiting on hiring manager'],['sched','Needs scheduling'],['fbdue','Feedback due'],['offer','Offers']];
function pipeList(){const f=S.pf,vj=(f.mine&&S.role!=='admin'&&S.role!=='talent'?followed():visible()).map(j=>j.id),q=f.q.toLowerCase();
  return active().filter(c=>vj.includes(c.job)&&c.stage!=='hired'&&(f.job==='All'||c.job===f.job)&&(f.stage==='All'||c.stage===f.stage)&&(!q||(c.name+' '+c.co).toLowerCase().includes(q))&&(f.chip==='all'||(f.chip==='sched'?['sched','avail'].includes(statusOf(c).k):f.chip==='offer'?c.stage==='offer':statusOf(c).k===f.chip)));}
function vPipeline(){const f=S.pf,list=pipeList(),base=S.pf.chip;const vj=(f.mine&&S.role!=='admin'&&S.role!=='talent'?followed():visible()).map(j=>j.id);const pool=active().filter(c=>vj.includes(c.job)&&c.stage!=='hired');
  const cnt=k=>k==='all'?pool.length:k==='sched'?pool.filter(c=>['sched','avail'].includes(statusOf(c).k)).length:k==='offer'?pool.filter(c=>c.stage==='offer').length:pool.filter(c=>statusOf(c).k===k).length;
  const need=list.filter(c=>['sched','avail'].includes(statusOf(c).k)),blocked=need.filter(c=>!canBook(c)).length;
  const sug=base==='sched'&&need.length&&isRecruiting()?`<div class="nudge prop">${ic('link')}<div><b>${need.length} candidate${need.length>1?'s':''} waiting for an interview.</b>Send direct booking links and each one picks from the panel's open slots.${blocked?` ${blocked} ${blocked>1?'are':'is'} on Dev Patel's jobs and need${blocked>1?'':'s'} his calendar connected first.`:''}<div class="acts"><button class="btn sm" data-act="book-all"${need.length-blocked?'':' disabled'}>Send ${need.length-blocked} booking link${need.length-blocked===1?'':'s'}</button>${blocked&&S.role==='recruiter'?'<button class="btn sm sec" data-act="connect-cal">Connect my calendar</button>':''}</div></div></div>`:'';
  return ph('Candidate pipeline','Active candidates across '+(f.mine&&S.role!=='admin'&&S.role!=='talent'?'your':'all')+' jobs')+
  `<div class="tb">${CHIPS.map(c=>`<button class="fchip" data-act="chip" data-c="${c[0]}" aria-pressed="${base===c[0]}">${c[1]} · ${cnt(c[0])}</button>`).join('')}</div>
  <div class="tb"><div class="search">${ic('search')}<input type="search" id="pfq" placeholder="Search by name or company" value="${esc(f.q)}" aria-label="Search pipeline"></div><select id="pfjob" aria-label="Job"><option value="All">All jobs</option>${visible().map(j=>`<option value="${j.id}"${f.job===j.id?' selected':''}>${esc(j.title)}</option>`).join('')}</select><select id="pfstage" aria-label="Stage"><option value="All">All stages</option>${Object.keys(ST).filter(k=>k!=='hired').map(k=>`<option value="${k}"${f.stage===k?' selected':''}>${ST[k]}</option>`).join('')}</select>${S.role==='recruiter'||S.role==='hm'?`<button class="fchip" data-act="pf-mine" aria-pressed="${f.mine}">My jobs only</button>`:''}</div>`+sug+`<div id="pf-res">${candTable(list)}</div>`;}
function vSearch(){const q=S.sq.toLowerCase();let list=C.filter(c=>S.sstat==='all'?c.status!=='pool':S.sstat==='pool'?c.status==='pool':c.status===S.sstat);if(q)list=list.filter(c=>(c.name+' '+c.co+' '+c.title+' '+c.skills.join(' ')).toLowerCase().includes(q));
  return ph('Candidate search','Everyone in Northwind\'s database, including 1,842 imported applications')+`<div class="tb"><div class="search" style="max-width:520px">${ic('search')}<input type="search" id="sq" placeholder="Name, company, title or skill (try “ROS 2”)" value="${esc(S.sq)}" aria-label="Search candidates"></div><div class="seg">${[['active','Active'],['archived','Archived'],['pool','In projects'],['all','All']].map(s=>`<button data-act="sstat" data-s="${s[0]}" aria-pressed="${S.sstat===s[0]}">${s[1]}</button>`).join('')}</div></div><p class="muted small">${list.length} result${list.length===1?'':'s'}${list.length>60?' · showing 60':''}</p>`+candTable(list.slice(0,60),{empty:'Try a different search.'});}

/* ============ candidate ============ */
function nextAction(c){const s=statusOf(c),j=J(c.job),n=me(),can=isRecruiting()||(S.role==='hm'&&j.hm===n);const iv=ivOf(c);
  const box=(cls,t,sub,btns)=>`<div class="next ${cls}"><div><b>${t}</b><span>${sub}</span></div><div class="acts">${btns||''}</div></div>`;
  const adv=nextStage(c)?`<button class="btn" data-act="advance" data-id="${c.id}">Advance to ${ST[nextStage(c)]}</button>`:'';
  const rej=`<button class="btn sec" data-act="archive-open" data-id="${c.id}">Reject</button>`;
  switch(s.k){
    case 'archived':return box('done','Archived',esc(c.reason||'No reason recorded'),can?`<button class="btn sec" data-act="unarchive" data-id="${c.id}">Unarchive</button>`:'');
    case 'pool':return box('done','In a project','Not being considered for a job yet',isRecruiting()?`<button class="btn" data-act="consider-one" data-id="${c.id}">Consider for job</button>`:'');
    case 'lead':return box('','Lead','Reach out before moving into review',can?`<button class="btn sec" data-act="email" data-id="${c.id}">${ic('mail')}Email</button>${adv}`:'');
    case 'review':return box('warn','Application review','Applied '+ago(c.applied).toLowerCase()+(c.source?' via '+esc(c.source):''),can?rej+adv:'');
    case 'hmr':return box('warn','Waiting on '+esc(j.hm),'In this stage '+ago(c.days).toLowerCase(),n===j.hm?rej+adv:isRecruiting()?`<button class="btn sec prop" data-act="remind-hm" data-id="${c.id}">${ic('mail')}Remind ${esc(j.hm.split(' ')[0])}</button>${adv}`:'');
    case 'sched':return box('warn','Schedule the '+ST[c.stage],DUR[c.stage]+' minutes · '+esc(panelFor(c,c.stage).join(', ')),can&&isRecruiting()?`<button class="btn" data-act="sched-open" data-id="${c.id}">${ic('cal')}Schedule</button>`:'');
    case 'avail':return box('','Availability received',esc(c.first)+' sent 6 open slots for next week',isRecruiting()?`<button class="btn" data-act="sched-open" data-id="${c.id}" data-m="avail">${ic('cal')}Pick a time</button>`:'');
    case 'scheduled':return box('',ST[c.stage]+' · '+dayL(iv.day)+' at '+iv.time,esc(iv.panel.join(', '))+' · '+esc(iv.loc)+(iv.mode==='booking'?' · booked by candidate':''),`<button class="btn sec" data-act="briefing" data-iv="${iv.id}">Briefing</button>${isRecruiting()?`<button class="btn ghost" data-act="sched-open" data-id="${c.id}">Reschedule</button>`:''}`);
    case 'fbdue':{const p=pend(iv);return box('warn','Waiting on feedback','From '+esc(p.join(', ')),p.includes(n)?`<button class="btn" data-act="fb-open" data-iv="${iv.id}">Submit feedback</button>`:isRecruiting()?`<button class="btn sec" data-act="toast" data-msg="Reminder sent in Slack to ${esc(p.join(', '))}.">Remind in Slack</button>`:'');}
    case 'decide':return box('warn','Ready for a decision','All feedback for '+ST[c.stage]+' is in · average '+(c.rating?REC[c.rating].toLowerCase():'—'),can?rej+adv:'');
    case 'offer':{const o=c.offer;
      if(!o)return box('warn','Create an offer','Compensation band '+esc(COMP[j.dept][1]),isRecruiting()?`<button class="btn" data-act="offer-open" data-id="${c.id}">Create offer</button>`:'');
      if(o.status==='Pending approval')return box('warn','Offer waiting for approval',esc(o.salary)+' · Maya Chen approves',S.role==='talent'?`<button class="btn" data-act="approve-offer" data-id="${c.id}">Approve</button>`:'');
      if(o.status==='Draft'||o.status==='Approved')return box('','Offer '+o.status.toLowerCase(),esc(o.salary)+' · start '+fmtDate(o.start),isRecruiting()?`<button class="btn sec" data-act="offer-letter" data-id="${c.id}">Preview letter</button><button class="btn" data-act="offer-extend" data-id="${c.id}">Extend offer</button>`:'');
      if(o.status==='Extended')return box('','Offer extended',esc(o.salary)+' · sent '+ago(o.ago||0).toLowerCase()+' · e-signature pending',isRecruiting()?`<button class="btn sec" data-act="offer-decline" data-id="${c.id}">Mark declined</button><button class="btn" data-act="offer-accept" data-id="${c.id}">Mark accepted</button>`:'');
      return box('done','Offer '+o.status.toLowerCase(),'',rej);}
    case 'hired':return box('done','Hired','Starts '+fmtDate(c.offer?c.offer.start:'2026-11-16')+' · sent to HRIS','');
  }return '';}
function progress(c){const p=planOf(J(c.job)),i=p.indexOf(c.stage),arch=c.status!=='active';return `<div><div class="prog">${p.map((k,x)=>`<i class="${arch?'':x<i?'past':x===i?'now':''}" title="${ST[k]}"></i>`).join('')}</div><div class="prog-l"><span>${arch?'Archived from '+ST[c.stage]:ST[c.stage]}</span><span>${arch?'':'Step '+(i+1)+' of '+p.length}</span></div></div>`;}
function candTabs(c,full){const tabs=[['feed','Activity'],['feedback','Feedback',c.fb.length],['resume','Resume'],['application','Application'],['emails','Emails',c.emails.length],['notes','Notes',c.notes.length]];
  const t=full?S.profTab:S.dTab==='overview'?'feed':S.dTab;
  const bar=`<div class="tabs">${tabs.map(x=>`<button class="tab" data-act="${full?'proftab':'dtab'}" data-t="${x[0]}" aria-selected="${t===x[0]}">${x[1]}${x[2]?`<span class="c">${x[2]}</span>`:''}</button>`).join('')}</div>`;
  let b='';
  if(t==='feed'){const items=c.feed.slice().sort((x,y)=>x.ago-y.ago);b=`<div class="feed">${items.map(f=>`<div class="fe">${av(f.who==='System'?'Northwind Robotics':f.who,'sm')}<div><div class="h"><b>${esc(f.who==='System'?'Northwind Robotics':f.who)}</b><span>${esc(f.text)}</span><small>${ago(f.ago)}</small></div>${f.body?`<div class="bd">${esc(f.body)}</div>`:''}</div></div>`).join('')}</div>`;}
  else if(t==='feedback'){const j=J(c.job),p=planOf(j);const ivs=IV.filter(i=>i.cand===c.id);const pending=[];ivs.forEach(i=>{if(i.day<0)pend(i).forEach(w=>pending.push([w,i]));});
    b=(pending.length?`<div class="rows" style="border:1px solid var(--line);border-radius:10px">${pending.map(([w,i])=>`<div class="row">${av(w,'sm')}<div><div class="t">${esc(w)}</div><div class="s">${ST[i.stage]} · ${dayL(i.day)} · feedback due</div></div>${w===me()?`<button class="btn sm" data-act="fb-open" data-iv="${i.id}">Submit</button>`:pill('p-warn','Due')}</div>`).join('')}</div>`:'')+
    (c.fb.length?p.filter(k=>c.fb.some(f=>f.stage===k)).map(k=>`<div class="stackc" style="gap:8px"><div class="small muted">${ST[k]}</div>${c.fb.filter(f=>f.stage===k).map(f=>`<div class="sc-card"><div class="sc-h"><span class="who">${av(f.by,'sm')}<b>${esc(f.by)}</b></span><span class="rec r${f.overall}">${REC[f.overall]}</span></div><div class="crit">${Object.keys(f.crit).map(x=>`<span>${esc(x)}</span><span>${rateBars(f.crit[x])}</span>`).join('')}</div><p>${esc(f.note)}</p><span class="muted small">${ago(f.ago)}</span></div>`).join('')}</div>`).join(''):'<div class="empty">No feedback yet.</div>')+
    (isRecruiting()||S.role==='hm'?`<div><button class="btn sec" data-act="fb-free" data-id="${c.id}">${ic('plus')}Add feedback</button></div>`:'');}
  else if(t==='resume')b=resumeHTML(c);
  else if(t==='application')b=`<dl class="kv"><dt>Why Northwind?</dt><dd>${parseInt(c.id.slice(1))%2?'I want to build software that leaves the lab and runs in real facilities. Northwind\'s fleet work is the closest thing I\'ve seen to that.':'I\'ve followed Northwind since the Series B and want to work on robots that ship.'}</dd><dt>Work authorization</dt><dd>Authorized to work in the US</dd><dt>Sponsorship</dt><dd>Not required</dd><dt>Earliest start</dt><dd>${fmtDate('2027-01-04')}</dd><dt>Expected salary</dt><dd>${esc(COMP[J(c.job).dept][1])}</dd><dt>LinkedIn</dt><dd>linkedin.com/in/${esc(c.email.split('@')[0].replace('.','-'))}</dd><dt>Source</dt><dd>${esc(c.source||'Not recorded (imported)')}</dd></dl>`;
  else if(t==='emails')b=`<div><button class="btn sec" data-act="email" data-id="${c.id}">${ic('mail')}New email</button></div><div class="feed">${c.emails.map(e=>`<div class="fe">${av(e.from,'sm')}<div><div class="h"><b>${esc(e.subj)}</b><small>${esc(e.from)} · ${ago(e.ago)}</small></div><div class="bd">${esc(e.body)}</div></div></div>`).join('')}</div>`;
  else b=`<div class="fg"><textarea id="note-t" placeholder="Add a note. Notes belong to ${esc(c.first)}, not a single job. Mention someone with @."></textarea><div class="acts"><button class="btn sm" data-act="add-note" data-id="${c.id}">Save note</button></div></div><div class="feed">${c.notes.map(n=>`<div class="fe">${av(n.who,'sm')}<div><div class="h"><b>${esc(n.who)}</b><small>${ago(n.ago)}</small></div><div class="bd">${esc(n.text)}</div></div></div>`).join('')||'<p class="muted">No notes yet.</p>'}</div>`;
  return bar+b;}
function resumeHTML(c){return `<div class="resume"><div><h3>${esc(c.name)}</h3><p class="muted">${esc(c.loc)} · ${esc(c.email)} · ${esc(c.phone)}</p></div><h4>Experience</h4>${c.exp.map(e=>`<div class="job"><div class="r1"><b>${esc(e.title)} · ${esc(e.co)}</b><span class="muted">${e.from} – ${e.to}</span></div><ul>${e.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}<h4>Education</h4><p>${esc(c.edu)}</p><h4>Skills</h4><p>${c.skills.map(esc).join(' · ')}</p></div>`;}
function detailsKV(c){return `<dl class="kv"><dt>Email</dt><dd>${esc(c.email)}</dd><dt>Phone</dt><dd>${esc(c.phone)}</dd><dt>Location</dt><dd>${esc(c.loc)}</dd><dt>Source</dt><dd>${c.source?esc(c.source):'<span class="muted">Not recorded</span>'}</dd>${c.credited?`<dt>Credited to</dt><dd>${esc(c.credited)}</dd>`:''}<dt>Applied</dt><dd>${ago(c.applied)}</dd></dl>`;}
function candHead(c,full){const j=J(c.job),p=planOf(j),can=isRecruiting()&&c.status==='active';
  return `<div class="pid">${av(c.name,'lg')}<div style="min-width:0"><h1>${esc(c.name)}</h1><p>${esc(c.title)} at ${esc(c.co)} · ${c.yrs} yrs · ${esc(c.loc)}</p></div></div>
  <div class="cons"><span class="muted">For</span><button class="lk" data-act="job" data-id="${j.id}">${esc(j.title)}</button>${can?`<select id="chg" aria-label="Move to stage" data-id="${c.id}">${p.map(k=>`<option value="${k}"${k===c.stage?' selected':''}>${ST[k]}</option>`).join('')}</select>`:''}${pill(statusOf(c).c,statusOf(c).t)}${c.tags.map(t=>`<span class="tag">${esc(t)}${isRecruiting()?`<button data-act="untag" data-id="${c.id}" data-t="${esc(t)}" aria-label="Remove tag">×</button>`:''}</span>`).join('')}${isRecruiting()?`<div class="mw"><button class="btn ghost sm" data-act="menu" data-m="tag">${ic('plus')}Tag</button>${S.menu==='tag'?`<div class="menu left">${S.tagsPool.filter(t=>!c.tags.includes(t)).map(t=>`<button data-act="tag" data-id="${c.id}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}</div>`:''}</div>
  ${progress(c)}${nextAction(c)}
  ${isRecruiting()||S.role==='hm'?`<div class="quick"><button class="btn sec sm" data-act="${full?'proftab':'dtab'}" data-t="notes">${ic('note')}Note</button>${isRecruiting()?`<button class="btn sec sm" data-act="email" data-id="${c.id}">${ic('mail')}Email</button>`:''}<button class="btn sec sm" data-act="fb-free" data-id="${c.id}">${ic('check')}Feedback</button>${isRecruiting()&&c.status==='active'?`<button class="btn sec sm" data-act="archive-open" data-id="${c.id}">${ic('archive')}Archive</button>`:''}${isRecruiting()?`<div class="mw"><button class="btn ghost sm" data-act="menu" data-m="more">More</button>${S.menu==='more'?`<div class="menu left">${PROJ.map(p=>`<button data-act="to-proj" data-id="${c.id}" data-p="${p.id}">${ic('folder')}Add to ${esc(p.name)}</button>`).join('')}</div>`:''}</div>`:''}</div>`:''}`;}
function drawerHTML(){if(!S.drawer)return '';const c=cand(S.drawer.id);if(!c)return '';const L=S.drawer.list||[],i=L.indexOf(c.id);
  return `<div class="scrim" data-act="close-drawer"></div><aside class="drawer" role="dialog" aria-label="${esc(c.name)}"><div class="dr-top"><button class="ib icon" data-act="dnav" data-d="-1" aria-label="Previous candidate"${i<=0?' disabled':''}>${ic('cl')}</button><button class="ib icon" data-act="dnav" data-d="1" aria-label="Next candidate"${i<0||i>=L.length-1?' disabled':''}>${ic('cr')}</button><span class="muted small">${i>=0?(i+1)+' of '+L.length:''} <kbd>J</kbd> <kbd>K</kbd></span><span class="sp"></span><button class="btn ghost sm" data-act="open-page" data-id="${c.id}">Open full profile ${ic('ext')}</button><button class="x" data-act="close-drawer" aria-label="Close">${ic('x')}</button></div>
  <div class="dr-body"><div class="dr-head" style="padding:16px 0 12px">${candHead(c,false)}</div><details><summary class="small muted" style="cursor:pointer">Contact and source</summary><div style="margin-top:10px">${detailsKV(c)}</div></details><div class="sticky" style="padding-top:0"></div>${candTabs(c,false)}</div></aside>`;}
function vCand(){const c=cand(S.candId),j=J(c.job);const projs=PROJ.filter(p=>p.members.includes(c.id));
  const others=C.filter(x=>x!==c&&x.name===c.name);
  return `<div class="crumbs"><button data-act="back">${S.hist.length?'← Back':'Candidates'}</button><span>/</span><span>${esc(c.name)}</span></div><div class="cols prof"><div class="stackc"><section class="panel"><div class="panel-b" style="gap:14px">${candHead(c,true)}</div></section><section class="panel"><div class="panel-b">${candTabs(c,true)}</div></section></div>
  <div class="stackc"><section class="panel"><div class="panel-h"><h2>Details</h2></div><div class="panel-b">${detailsKV(c)}</div></section><section class="panel"><div class="panel-h"><h2>Hiring team</h2></div><div class="rows">${[['Recruiter',j.rec],['Hiring manager',j.hm],['Coordinator',j.coord]].map(r=>`<div class="row">${av(r[1],'sm')}<div><div class="t">${esc(r[1])}</div><div class="s">${r[0]}</div></div><span></span></div>`).join('')}</div></section><section class="panel"><div class="panel-h"><h2>Projects</h2></div><div class="panel-b">${projs.length?projs.map(p=>`<button class="lk" data-act="project" data-id="${p.id}">${esc(p.name)}</button>`).join(''):'<p class="muted small">Not in any projects.</p>'}</div></section><section class="panel"><div class="panel-h"><h2>Files</h2></div><div class="rows"><div class="row">${ic('doc')}<div><div class="t">${esc(c.name.replace(' ','_'))}_Resume.pdf</div><div class="s">Uploaded with application · 142 KB</div></div><button class="btn sm ghost" data-act="proftab" data-t="resume">View</button></div></div></section></div></div>`;}

/* ============ application review ============ */
function revQueue(){const j=J(S.jobId);return active().filter(c=>c.job===j.id&&c.stage==='review').sort((a,b)=>S.revSort==='oldest'?b.days-a.days:a.days-b.days);}
function vReview(){const j=J(S.jobId),q=revQueue();const back=`<button data-act="job" data-id="${j.id}">${esc(j.title)}</button><span>/</span><span>Application review</span>`;
  if(!q.length)return ph('Application review',esc(j.title),'',back)+`<section class="panel"><div class="empty"><b>All caught up</b>No applications left to review for ${esc(j.title)}.<div class="acts" style="justify-content:center;margin-top:12px"><button class="btn" data-act="job" data-id="${j.id}">Back to pipeline</button></div></div></section>`;
  if(S.revIdx>=q.length)S.revIdx=q.length-1;const c=q[S.revIdx];
  const tabs=[['resume','Resume'],['application','Application'],['feed','Activity']];
  const center=S.revTab==='resume'?resumeHTML(c):S.revTab==='application'?candTabsFor(c,'application'):candTabsFor(c,'feed');
  return ph('Application review',`${esc(j.title)} · ${S.revIdx+1} of ${q.length}`,`<select id="revsort" aria-label="Order"><option value="oldest"${S.revSort==='oldest'?' selected':''}>Oldest first</option><option value="newest"${S.revSort==='newest'?' selected':''}>Newest first</option></select>`,back)+
  `<div class="rv"><section class="panel q"><div class="panel-h"><h2>Queue</h2><span class="meta">${q.length}</span></div><div class="rows">${q.map((x,i)=>`<div class="row" data-act="rev-pick" data-i="${i}" aria-current="${i===S.revIdx}"><div><div class="t">${esc(x.name)}</div><div class="s">${esc(x.title)} · ${x.days}d</div></div>${x.source==='Referral'?pill('p-cs','Referral',true):''}</div>`).join('')}</div></section>
  <section class="panel"><div class="panel-b" style="gap:14px"><div class="pid">${av(c.name,'lg')}<div><h1>${esc(c.name)}</h1><p>${esc(c.title)} at ${esc(c.co)} · ${c.yrs} yrs · ${esc(c.loc)} · applied ${ago(c.applied).toLowerCase()}${c.source?' via '+esc(c.source):''}</p></div></div><div class="tabs">${tabs.map(t=>`<button class="tab" data-act="revtab" data-t="${t[0]}" aria-selected="${S.revTab===t[0]}">${t[1]}</button>`).join('')}</div>${center}</div></section>

function hbars(rows,o){o=o||{};const mx=o.max||Math.max(1,...rows.map(r=>r[1]));return `<div class="hbars">${rows.map(r=>`<div class="hb"><span>${esc(r[0])}</span><span class="tr"><i class="${r[3]||''}" style="width:${Math.min(100,r[1]/mx*100)}%"></i>${o.mark!=null?`<span class="mk" style="left:${o.mark/mx*100}%"></span>`:''}</span><span class="v">${esc(r[2]!=null?r[2]:r[1])}</span></div>`).join('')}</div>`;}
function funnelData(){const order=['review','screen','hmr','onsite','offer','hired'];const all=C.filter(c=>c.status!=='pool'&&c.stage!=='lead');const idx=c=>{const s=c.stage==='tech'?'hmr':c.stage;return order.indexOf(s);};

 plan:{t:'Q1 Hiring Plan',sub:'Hires against plan, by team',body:()=>{const rows=teamRows(),risk=rows.reduce((a,r)=>a.concat(r.risk),[]);const h=rows.reduce((s,r)=>s+r.hired,0),p=rows.reduce((s,r)=>s+r.plan,0),unk=rows.reduce((s,r)=>s+r.unknown,0);

 health:{t:'Pipeline Health',sub:'Where candidates are and why they leave',body:()=>{const a=active();const ks=['lead','review','screen','hmr','tech','onsite','offer'];const arch=C.filter(c=>c.status==='archived'),rc={};arch.forEach(c=>{const k=c.reason||'No reason recorded';rc[k]=(rc[k]||0)+1;});const rk=Object.keys(rc).sort((x,y)=>rc[y]-rc[x]);

const METRICS=[['active','Active candidates'],['hires','Hires'],['archived','Archived candidates'],['all','All candidates']],GROUPS=[['source','Source'],['stage','Stage'],['dept','Team'],['job','Job'],['reason','Archive reason'],['rec','Recruiter']];
function builderSet(cfg){let s=C.filter(c=>c.status!=='pool');if(cfg.metric==='active')s=s.filter(c=>c.status==='active'&&c.stage!=='hired');if(cfg.metric==='hires')s=s.filter(c=>c.status==='active'&&c.stage==='hired');if(cfg.metric==='archived')s=s.filter(c=>c.status==='archived');if(cfg.dept!=='All')s=s.filter(c=>J(c.job).dept===cfg.dept);return s;}
function builderResult(cfg){const s=builderSet(cfg);const key=c=>({source:c.source||'Unknown',stage:c.status==='archived'?'Archived':ST[c.stage],dept:J(c.job).dept,job:J(c.job).title,reason:c.status==='archived'?(c.reason||'No reason recorded'):'Not archived',rec:J(c.job).rec})[cfg.group];
  const g={};s.forEach(c=>{const k=key(c);g[k]=(g[k]||0)+1;});const ks=Object.keys(g).sort((a,b)=>g[b]-g[a]);
  if(!ks.length)return '<div class="empty">No data for this combination.</div>';
  return cfg.chart==='bar'?hbars(ks.map(k=>[k,g[k],g[k]+' · '+Math.round(g[k]/s.length*100)+'%',/Unknown|No reason/.test(k)?'w':''])):`<div class="tw"><table class="t"><thead><tr><th>${esc(GROUPS.find(x=>x[0]===cfg.group)[1])}</th><th>Count</th><th>Share</th></tr></thead><tbody>${ks.map(k=>`<tr><td>${esc(k)}</td><td class="num">${g[k]}</td><td class="num">${Math.round(g[k]/s.length*100)}%</td></tr>`).join('')}</tbody></table></div>`;}

function vPlanner(){const rows=teamRows().map(r=>{const all=C.filter(c=>c.status!=='pool'&&J(c.job).dept===r.d).length;const rate=Math.max(.04,r.hired&&all?r.hired/all:.06);const need=Math.max(0,r.plan-r.hired);const pipe=active().filter(c=>J(c.job).dept===r.d&&c.stage!=='hired').length;const req=Math.ceil(need/rate);return Object.assign(r,{rate,need,pipe,req});});
  return ph('Recruiting Planner','What it will take to hit the Q1 plan, from each team\'s pass-through rate. Edit the plan to see the effect.')+`<section class="panel"><div class="tw"><table class="t"><thead><tr><th>Team</th><th>Q1 plan</th><th>Hired</th><th>Still to hire</th><th>Hire rate</th><th>Candidates needed</th><th>Active pipeline</th><th>Outlook</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.d)}</b></td><td><input type="number" min="0" max="40" value="${r.plan}" data-team="${esc(r.d)}" class="plan-in" style="width:64px" aria-label="Q1 plan for ${esc(r.d)}"></td><td class="num">${r.hired}</td><td class="num">${r.need}</td><td class="num">${(r.rate*100).toFixed(1)}%</td><td class="num">${r.req}</td><td class="num">${r.pipe}</td><td>${r.need===0?pill('p-good','Done'):r.pipe>=r.req?pill('p-good','On track'):pill('p-warn','Short '+(r.req-r.pipe))}</td></tr>`).join('')}</tbody></table></div></section><p class="muted small">Hire rate is hires divided by everyone considered for that team since go-live, including imported applications.</p>`;}

    const ref=k==='referral';return M(ref?'Refer someone':'Add a candidate',ref?'Northwind pays a $3,000 bonus for engineering hires':'They start in the Lead stage',`<div class="fg"><div class="two"><label>Full name<input id="na-n" placeholder="Jamie Ortiz"></label><label>Email<input id="na-e" type="email" placeholder="jamie@example.com"></label></div><label>Job<select id="na-j">${jobOpts()}</select></label>${ref?'<label>How do you know them?<textarea id="na-w" placeholder="Worked together at Zipline for two years. Strongest firmware engineer I know."></textarea></label>':''}</div>`,CANCEL+`<button class="btn" data-act="add-go" data-k="${k}">${ref?'Submit referral':'Add candidate'}</button>`);}
  case 'approval':return M('Offer approval process','Every offer goes to the approver before it can be extended',`<div class="fg"><label>Approver<select id="ap-a"><option>Maya Chen</option><option>Jordan Ellis</option></select></label><label>Applies to<select><option>All offers</option><option>Offers above the band midpoint</option></select></label></div>`,CANCEL+`<button class="btn" data-act="approval-go">Create process</button>`);

/* ============ toasts & undo ============ */
let tid=0;function toast(msg,undo){const id=++tid;S.toasts.push({id,msg,undo});if(S.toasts.length>3)S.toasts=S.toasts.slice(-3);renderToasts();setTimeout(()=>{S.toasts=S.toasts.filter(t=>t.id!==id);renderToasts();},undo?6500:4200);}
function renderToasts(){document.getElementById('toasts').innerHTML=S.toasts.map(t=>`<div class="toast"><span>${esc(t.msg)}</span>${t.undo?`<button data-act="undo" data-t="${t.id}">Undo</button>`:''}</div>`).join('');}
const snap=c=>JSON.parse(JSON.stringify({stage:c.stage,status:c.status,reason:c.reason,days:c.days,feed:c.feed,offer:c.offer,avail:c.avail}));

/* ============ mutations ============ */
function move(c,to,quiet){if(!c||!to||c.stage===to)return;const s=snap(c);const from=c.stage;c.stage=to;c.days=0;c.avail=false;c.status='active';log(c,'Moved from '+ST[from]+' to '+ST[to]);countAct();
  if(to==='hired'){c.tth=between(30,44);const op=OP.find(o=>o.job===c.job&&o.status==='Open');if(op)op.status='Filled';}
  if(!quiet)toast(c.first+' moved to '+ST[to],()=>{Object.assign(c,s);});}
function archive(c,reason,quiet){const s=snap(c);c.status='archived';c.reason=reason||null;log(c,'Archived'+(reason?' · '+reason:''));countAct();if(!quiet)toast(c.first+' archived'+(reason?' · '+reason:''),()=>{Object.assign(c,s);});}
function schedule(c,mode,day,time){const iv=addIV(c,{day:day!=null?day:FUT[(IV.length+2)%FUT.length],time:time||TIMES[IV.length%TIMES.length],mode});c.avail=false;log(c,(mode==='booking'?'Booked ':'Scheduled ')+ST[iv.stage]+' for '+dayL(iv.day)+' at '+iv.time+(mode==='booking'?' from a booking link':''));
  c.emails.unshift({subj:'Your '+ST[iv.stage]+' with Northwind Robotics',from:J(c.job).coord,ago:0,body:'Hi '+c.first+', you are confirmed for '+fmtDay(iv.day)+' at '+iv.time+' CT.'});return iv;}
function submitFb(c,stage,iv){const f=S.fbf;const note=(document.getElementById('fb-note')||{}).value||'';c.fb.push({by:me(),stage,overall:f.overall,crit:Object.assign({},f.crit),note:note.trim()||'No written notes.',ago:0});if(iv)iv.fb[me()]=true;
  c.rating=Math.round(c.fb.reduce((a,x)=>a+x.overall,0)/c.fb.length);log(c,'Submitted feedback for '+ST[stage]+' · '+REC[f.overall]);countAct();S.fbf={overall:0,crit:{}};}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if((S.menu&&!e.target.closest('.mw'))||(S.gs&&!e.target.closest('.gs'))){S.menu=null;if(!e.target.closest('.gs'))S.gs='';render();}return;}
  if(el.disabled)return;
  if(el.dataset.act==='close-modal-bg'&&e.target!==el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  if(el.type!=='checkbox')e.preventDefault();
  if(S.menu&&el.dataset.act!=='menu'&&!el.closest('.menu'))S.menu=null;
  if(el.classList.contains('card')&&dragging)return;
  fn(el.dataset,el,e);
});
document.addEventListener('input',e=>{const id=e.target.id,val=e.target.value;
  if(id==='gs'){S.gs=val;S.gsi=0;render();}
  else if(id==='jq'||id==='jsq'){S.jq=val;render();}
  else if(id==='pfq'){S.pf.q=val;render();}
  else if(id==='sq'){S.sq=val;render();}
  else if(id==='eq'){S.eq=val;render();}
  else if(e.target.classList.contains('plan-in')){S.planQ[e.target.dataset.team]=Math.max(0,Number(val)||0);}
});
document.addEventListener('change',e=>{const t=e.target,id=t.id,val=t.value;
  if(id==='jdept'){S.jobsDept=val;render();}
  else if(id==='pfjob'){S.pf.job=val;render();}else if(id==='pfstage'){S.pf.stage=val;render();}
  else if(id==='revsort'){S.revSort=val;S.revIdx=0;render();}
  else if(id==='rb-m'){S.rb.metric=val;render();}else if(id==='rb-g'){S.rb.group=val;render();}else if(id==='rb-d'){S.rb.dept=val;render();}
  else if(id==='chg'){const c=cand(t.dataset.id);move(c,val);render();}
  else if(id==='em-t'){S.emailT=val;S.clear=['em-s','em-b'];render();}
  else if(t.classList.contains('plan-in')){render();}
  else if(t.classList.contains('acc-sel')){U(t.dataset.user).access=val;toast('Access updated for '+t.dataset.user);}
});
const typing=()=>{const a=document.activeElement;return a&&(['INPUT','TEXTAREA','SELECT'].includes(a.tagName)||a.isContentEditable);};
document.addEventListener('keydown',e=>{
  if(e.target.id==='gs'){const items=gsItems();if(e.key==='ArrowDown'){S.gsi=Math.min(items.length-1,S.gsi+1);render();e.preventDefault();return;}if(e.key==='ArrowUp'){S.gsi=Math.max(0,S.gsi-1);render();e.preventDefault();return;}
    if(e.key==='Enter'&&items[S.gsi]){const x=items[S.gsi];e.preventDefault();$('gs').blur();if(x.act==='go')A.go({p:x.p});else if(x.act==='job')A.job({id:x.id});else A['open-page']({id:x.id});return;}
    if(e.key==='Escape'){S.gs='';$('gs').blur();render();return;}}
  if((e.key==='k'&&(e.metaKey||e.ctrlKey))||(e.key==='/'&&!typing())){e.preventDefault();$('gs').focus();return;}
  if(e.key==='Escape'){if(S.modal){A['close-modal']();return;}if(S.menu){S.menu=null;render();return;}if(S.drawer){A['close-drawer']();return;}}
  if(typing()||S.modal||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='?'){A.shortcuts();return;}
  if(S.drawer&&(e.key==='j'||e.key==='k')){A.dnav({d:e.key==='j'?1:-1});return;}
  if(S.page==='review'){const q=revQueue();if(!q.length)return;const c=q[S.revIdx];
    if(e.key==='j'){S.revIdx=Math.min(q.length-1,S.revIdx+1);S.rv={score:0};render();}
    else if(e.key==='k'){S.revIdx=Math.max(0,S.revIdx-1);S.rv={score:0};render();}
    else if(e.key==='a')A['rv-adv']({id:c.id});
    else if(e.key==='r'){e.preventDefault();$('rv-reason').focus();}
    else if('1234'.includes(e.key)){S.rv.score=Number(e.key);render();}}
});
